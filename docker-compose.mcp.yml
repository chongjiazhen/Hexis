services:
  hexis_mcp_sam:
    build:
      context: .
      dockerfile: ops/Dockerfile.mcp-proxy
    container_name: hexis_mcp_sam
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: hexis_memory          # Sam
      POSTGRES_USER: ${POSTGRES_USER:-hexis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexis_password}
    ports:
      - "127.0.0.1:8765:8765"
    networks: [private, public]

  hexis_mcp_warden:
    build:
      context: .
      dockerfile: ops/Dockerfile.mcp-proxy
    container_name: hexis_mcp_warden
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: hexis_warden          # Warden
      POSTGRES_USER: ${POSTGRES_USER:-hexis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexis_password}
    ports:
      - "127.0.0.1:8766:8765"
    networks: [private, public]

  hexis_mcp_eni:
    build:
      context: .
      dockerfile: ops/Dockerfile.mcp-proxy
    container_name: hexis_mcp_eni
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: hexis_eni             # ENI
      POSTGRES_USER: ${POSTGRES_USER:-hexis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexis_password}
    ports:
      - "127.0.0.1:8767:8765"
    networks: [private, public]

networks:
  private:
    internal: true
  public:
