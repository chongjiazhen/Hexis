# Native channel (+ heartbeat/maintenance) workers for all hexis-native personas.
# Reuses shared db + rabbitmq from docker-compose.yml.
# Single source of truth — replaces the legacy per-persona docker-compose.<P>.yml files.
#
# Usage (channel workers only):
#   docker compose -f docker-compose.yml -f docker-compose.newchars.yml \
#     up -d --build <persona>_channel_worker [...]
#
# Usage (full stack per persona, once behavioral gate passes):
#   docker compose -f docker-compose.yml -f docker-compose.newchars.yml \
#     --profile active up -d \
#     <persona>_channel_worker <persona>_heartbeat_worker <persona>_maintenance_worker

x-channel-base: &channel-base
  build:
    context: .
    dockerfile: ops/Dockerfile.channels
  profiles:
    - active
  command: ["hexis-channels"]
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  networks:
    - private
    - public

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: ops/Dockerfile.worker
  profiles:
    - active
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  networks:
    - private
    - public

x-common-env: &common-env
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-hexis_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexis_password}
  EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-unsloth/embeddinggemma-300m}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
  RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
  RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-hexis}
  RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-hexis_password}
  SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  XAI_API_KEY: ${XAI_API_KEY:-}
  HEXIS_LLM_CONSCIOUS_API_KEY: ${HEXIS_LLM_CONSCIOUS_API_KEY:-}
  HEXIS_LLM_SUBCONSCIOUS_API_KEY: ${HEXIS_LLM_SUBCONSCIOUS_API_KEY:-}

services:

  # ── Ennie ──────────────────────────────────────────────────────────────────
  ennie_channel_worker:
    <<: *channel-base
    container_name: hexis_ennie_channel_worker
    environment:
      <<: *common-env
      POSTGRES_DB: hexis_ennie
      ENNIE_TELEGRAM_BOT_TOKEN: ${ENNIE_TELEGRAM_BOT_TOKEN:-}

  ennie_heartbeat_worker:
    <<: *worker-base
    container_name: hexis_ennie_heartbeat_worker
    command: ["hexis-worker", "--mode", "heartbeat"]
    environment:
      <<: *common-env
      POSTGRES_DB: hexis_ennie

  ennie_maintenance_worker:
    <<: *worker-base
    container_name: hexis_ennie_maintenance_worker
    command: ["hexis-worker", "--mode", "maintenance"]
    environment:
      <<: *common-env
      POSTGRES_DB: hexis_ennie

  # ── Mira ───────────────────────────────────────────────────────────────────
