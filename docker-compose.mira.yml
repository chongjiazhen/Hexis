# DEPRECATED — services moved to docker-compose.newchars.yml.
# Keep for reference only; do not use for new deployments.
# Use: docker compose -f docker-compose.yml -f docker-compose.newchars.yml ...
#
# Worker stack for the Mira instance.
#
# Reuses the shared db + rabbitmq from docker-compose.yml. Workers point at the
# hexis_mira database (POSTGRES_DB override).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.mira.yml \
#     --profile active up -d \
#     mira_heartbeat_worker mira_maintenance_worker

services:
  mira_channel_worker:
    build:
      context: .
      dockerfile: ops/Dockerfile.channels
    container_name: hexis_mira_channel_worker
    profiles:
      - active
    command: ["hexis-channels"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: hexis_mira
      POSTGRES_USER: ${POSTGRES_USER:-hexis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexis_password}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-unsloth/embeddinggemma-300m}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-hexis}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-hexis_password}
      MIRA_TELEGRAM_BOT_TOKEN: ${MIRA_TELEGRAM_BOT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      HEXIS_LLM_CONSCIOUS_API_KEY: ${HEXIS_LLM_CONSCIOUS_API_KEY:-}
      HEXIS_LLM_SUBCONSCIOUS_API_KEY: ${HEXIS_LLM_SUBCONSCIOUS_API_KEY:-}
    networks:
      - private
      - public

  mira_heartbeat_worker:
    build:
      context: .
      dockerfile: ops/Dockerfile.worker
    container_name: hexis_mira_heartbeat_worker
    profiles:
      - active
    command: ["hexis-worker", "--mode", "heartbeat"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: hexis_mira
      POSTGRES_USER: ${POSTGRES_USER:-hexis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexis_password}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-unsloth/embeddinggemma-300m}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-hexis}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-hexis_password}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      HEXIS_LLM_CONSCIOUS_API_KEY: ${HEXIS_LLM_CONSCIOUS_API_KEY:-}
      HEXIS_LLM_SUBCONSCIOUS_API_KEY: ${HEXIS_LLM_SUBCONSCIOUS_API_KEY:-}
    networks:
      - private
      - public

  mira_maintenance_worker:
    build:
      context: .
      dockerfile: ops/Dockerfile.worker
    container_name: hexis_mira_maintenance_worker
    profiles:
      - active
    command: ["hexis-worker", "--mode", "maintenance"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: hexis_mira
      POSTGRES_USER: ${POSTGRES_USER:-hexis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexis_password}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-unsloth/embeddinggemma-300m}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-hexis}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-hexis_password}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      HEXIS_LLM_CONSCIOUS_API_KEY: ${HEXIS_LLM_CONSCIOUS_API_KEY:-}
      HEXIS_LLM_SUBCONSCIOUS_API_KEY: ${HEXIS_LLM_SUBCONSCIOUS_API_KEY:-}
    networks:
      - private
      - public
